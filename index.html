<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Verified companion directory with published rates, live availability and online booking requests." />
    <meta name="theme-color" content="#111114" />
    <meta name="rating" content="adult" />
    <link rel="icon" type="image/svg+xml" href="/aurelia-icon.svg?v=2" />
    <link rel="apple-touch-icon" href="/aurelia-icon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Web fonts load without blocking the first paint (text shows in a fallback font, then swaps). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <!-- Start the site data request while the JavaScript downloads (SiteContext reuses the response). -->
    <link rel="preload" href="/api/site/bootstrap" as="fetch" crossorigin="anonymous" />
    <title>Aurelia Companions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
